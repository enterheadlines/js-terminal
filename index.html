<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JS Terminal v2 (Enhanced)</title>
  <meta name="description" content="A simple JS Terminal (enhanced)" />


  <!-- Google tag (gtag.js) - kept exactly as provided -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-36EM66LHER"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-36EM66LHER');
  </script>

  <!-- Inline enhanced styles-->
  <style>
    :root{
      --bg:#121212;
      --panel:#1e1e1e;
      --panel-2:#111111;
      --accent:#00ff00;
      --accent-dim:rgba(0,255,0,0.18);
      --text:#00ff00;
      --muted:rgba(0,255,0,0.6);
      --glass: rgba(255,255,255,0.02);
    }

    /* --- Base layout --- */
    html,body{height:100%;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family: 'Courier New', Courier, monospace;
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Terminal wrapper: retains original values but improved visuals */
    .terminal-wrapper{
      width:800px;
      height:500px;
      background:linear-gradient(180deg,var(--panel),#171717);
      border:2px solid var(--accent);
      border-radius:10px;
      display:flex;
      flex-direction:column;
      box-shadow:0 8px 30px var(--accent-dim), inset 0 -3px 8px rgba(0,0,0,0.6);
      position:absolute;
      top:50px;
      left:50px;
      transition: all 260ms cubic-bezier(.2,.9,.2,1);
      backdrop-filter: blur(3px);
      user-select:none;
      -webkit-user-select:none;
    }

    .terminal-header{
      background:var(--panel-2);
      display:flex;
      align-items:center;
      padding:8px 10px;
      cursor:move;
      gap:8px;
    }

    .terminal-btn{ width:14px; height:14px; border-radius:50%; margin:0 4px; display:inline-block; }
    .close{ background:#ff5f56; }
    .minimize{ background:#ffbd2e; }
    .maximize{ background:#27c93f; }
    .terminal-btn:hover{ transform:scale(1.18); box-shadow:0 3px 10px rgba(0,0,0,0.6); }

    /* Terminal area */
    #terminal{
      flex-grow:1;
      padding:12px 14px;
      overflow-y:auto;
      font-size:15px;
      line-height:1.5;
      white-space:pre-wrap;
      -webkit-overflow-scrolling:touch;
    }

    /* input area */
    #inputRow{ display:flex; align-items:center; border-top:1px solid var(--accent); }
    #prompt{ padding:10px; color:var(--muted); min-width:80px; }
    #commandInput{
      flex:1; border:none; outline:none; background:transparent; color:var(--text);
      font-family:inherit; font-size:15px; padding:10px; caret-color:var(--accent);
    }

    /* secret button (kept hidden until unlocked) */
    #secret-btn{ display:none; margin-top:10px; padding:10px; border:none; background:var(--accent); color:#031003; cursor:pointer; border-radius:6px; }
    #secret-btn:hover{ background:#00cc00; }

    .command-output{ margin:6px 0; }
    .cmd{ color:var(--accent); }
    .result{ color:var(--text); }
    .timestamp{ color:var(--muted); font-size:12px; margin-right:6px; }

    /* minimized dock */
    .minimized{ width:200px !important; height:34px !important; bottom:10px !important; left:10px !important; top:auto !important; display:flex !important; align-items:center; justify-content:center; cursor:pointer; border-radius:8px; }
    .minimized #terminal, .minimized #inputRow{ display:none; }

    /* focus ring for accessibility */
    .focus-ring:focus{ outline:2px solid rgba(0,255,0,0.14); outline-offset:2px; }

    /* small screens */
    @media (max-width:768px){
      .terminal-wrapper{ width:95%; height:80vh; top:10px; left:50%; transform:translateX(-50%); border-radius:8px; }
      #terminal{ font-size:14px; }
      #commandInput{ font-size:14px; padding:12px; }
      .terminal-btn{ width:20px; height:20px; margin:0 6px; }
    }

    /* subtle animation for new outputs */
    .fade-in{ animation:fadeIn 280ms ease both; }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  </style>
</head>
<body>

  <div class="terminal-wrapper" id="terminalWrapper" role="application" aria-label="JS Terminal v2">
    <div class="terminal-header" id="terminalHeader">
      <span class="terminal-btn close" id="closeBtn" title="Close"></span>
      <span class="terminal-btn minimize" id="minimizeBtn" title="Minimize"></span>
      <span class="terminal-btn maximize" id="maximizeBtn" title="Maximize"></span>
      <span style="margin-left:10px;color:var(--accent);font-weight:600;">JS Terminal V2</span>
    </div>

    <div id="terminal" aria-live="polite"></div>

    <!-- improved input row keeps the input separate from terminal output (but functionality preserved) -->
    <div id="inputRow">
      <div id="prompt" title="prompt">&gt; <span id="cwd">/user/home</span></div>
      <input id="commandInput" class="focus-ring" aria-label="Terminal command input" placeholder="Type a command..." autocomplete="off" autocapitalize="off" spellcheck="false" />
    </div>
  </div>

  <button id="secret-btn" onclick="window.open('https://entertopia.netlify.app','_blank')">Secret Free Link</button>


  <!-- Enhanced inline script (augments and preserves original behavior) -->
  <script>
  // --- Grab elements ---
  const terminal = document.getElementById('terminal');
  const commandInput = document.getElementById('commandInput');
  const wrapper = document.getElementById('terminalWrapper');
  const promptEl = document.getElementById('prompt');
  const cwdEl = document.getElementById('cwd');
  const secretBtn = document.getElementById('secret-btn');

  // Keep original state names but add enhancements
  let isMaximized = false;
  let normalState = { width: "800px", height: "500px", top: "50px", left: "50px" };

  // --- file system (preserve original files) ---
  const fileSystem = {
    'file1.txt': 'This is the content of file1.txt.',
    'file2.txt': 'This is the content of file2.txt.',
    'directory1': {},
  };

  // Utility: safe split (handles extra spaces and quotes)
  function parseInput(input){
    // simple parser: splits by spaces but keeps quoted strings together
    const parts = [];
    let cur = '';
    let inQuotes = false;
    for(let i=0;i<input.length;i++){
      const c = input[i];
      if(c === '"') { inQuotes = !inQuotes; continue; }
      if(c === ' ' && !inQuotes){ if(cur!==''){ parts.push(cur); cur=''; } continue; }
      cur += c;
    }
    if(cur!=='') parts.push(cur);
    return parts;
  }

  // --- commands object: preserved but improved with consistent signatures ---
  const commands = {
    help: () => `Available commands:\nhelp, clear, date, echo, ls, pwd, whoami, cat, touch, mkdir, rmdir, rm, cp, mv, ping, exit, info, version, weather, history, rename, joke, discord, github, instagram`,

    // clear: clears terminal but keep welcome preserved (we'll keep same behavior)
    clear: () => { terminal.innerHTML = ''; return ''; },

    date: () => new Date().toString(),
    echo: (args) => args.join(' '),
    ls: () => Object.keys(fileSystem).join(', '),
    pwd: () => "/user/home",
    whoami: () => "You are logged in as user.",

    cat: (args) => {
      const fileName = args[0];
      return fileSystem[fileName] ? fileSystem[fileName] : `No such file: ${fileName}`;
    },

    touch: (args) => {
      const fileName = args[0];
      if (fileName) {
        fileSystem[fileName] = '';
        return `Created file ${fileName}`;
      }
      return 'Usage: touch <filename>';
    },

    mkdir: (args) => {
      const dirName = args[0];
      if (dirName) {
        fileSystem[dirName] = {};
        return `Created directory ${dirName}`;
      }
      return 'Usage: mkdir <directoryname>';
    },

    rmdir: (args) => {
      const dirName = args[0];
      if (fileSystem[dirName] && typeof fileSystem[dirName] === 'object') {
        delete fileSystem[dirName];
        return `Removed directory ${dirName}`;
      }
      return `No such directory: ${dirName}`;
    },

    rm: (args) => {
      const fileName = args[0];
      if (fileSystem[fileName]) {
        delete fileSystem[fileName];
        return `Removed file ${fileName}`;
      }
      return `No such file: ${fileName}`;
    },

    cp: (args) => {
      const source = args[0];
      const destination = args[1];
      if (fileSystem[source]) {
        fileSystem[destination] = fileSystem[source];
        return `Copied ${source} to ${destination}`;
      }
      return `No such file: ${source}`;
    },

    mv: (args) => {
      const source = args[0];
      const destination = args[1];
      if (fileSystem[source]) {
        fileSystem[destination] = fileSystem[source];
        delete fileSystem[source];
        return `Moved ${source} to ${destination}`;
      }
      return `No such file: ${source}`;
    },

    ping: (args) => {
      const target = args[0] || 'localhost';
      return `Pinging ${target}... Response: 64 bytes from ${target}: icmp_seq=1 ttl=64 time=0.1 ms`;
    },

    exit: () => {
      window.location.href = "https://www.google.com";
      return "Exiting terminal...";
    },

    info: () => "This is a simulated JS terminal. Just for fun.",
    version: () => "Terminal version 2",

    weather: () => {
      const reports = [
        "Sunny with clear skies.",
        "Partly cloudy with a light breeze.",
        "Rain showers expected later today.",
        "Storm warning: stay indoors!",
        "Snow is falling outside. Grab a coat!"
      ];
      return reports[Math.floor(Math.random()*reports.length)];
    },

    // history preserved as closure (keeps original behavior)
    history: (()=>{
      const history = [];
      return (input)=>{ if(input) history.push(input); return history.join(', '); };
    })(),

    rename: (args)=>{
      const oldName = args[0];
      const newName = args[1];
      if (fileSystem[oldName]){
        fileSystem[newName] = fileSystem[oldName];
        delete fileSystem[oldName];
        return `Renamed ${oldName} to ${newName}`;
      }
      return `No such file: ${oldName}`;
    },

    joke: ()=>{
      const jokes = [
        "Why don’t scientists trust atoms? Because they make up everything.",
        "Why did the computer go to the doctor? Because it caught a virus.",
        "Why was the math book sad? It had too many problems.",
        "Why did the scarecrow win an award? Because he was outstanding in his field.",
        "Why can’t your nose be 12 inches long? Because then it would be a foot."
      ];
      return jokes[Math.floor(Math.random()*jokes.length)];
    },

    discord: ()=>{ window.open("https://discord.gg/CEfhTm49jw","_blank"); return "Opening Discord..."; },
    github: ()=>{ window.open("https://github.com/enterheadlines/js-terminal","_blank"); return "Opening GitHub..."; },
    instagram: ()=>{ window.open("https://www.instagram.com/enterheadlines","_blank"); return "Opening Instagram..."; }
  };

  // --- Welcome message (preserve original text but format) ---
  function writeWelcome(){
    const html = `\nWelcome to the JS Terminal v2\nThis is just for fun, not a real working terminal.\nType 'help' to see available commands.\nTry 'discord', 'github', or 'instagram' to visit my pages.\n`;
    writeOutput(html, {raw:true});
  }
  writeWelcome();

  // --- Output helper ---
  function timestamp(){
    const d = new Date();
    return d.toLocaleTimeString();
  }

  function writeOutput(text, opts={}){
    const wrap = document.createElement('div');
    wrap.className = 'command-output fade-in';
    if(opts.raw){
      // keep newlines
      wrap.innerText = text;
    } else if(opts.isCommand){
      wrap.innerHTML = `<span class="timestamp">[${timestamp()}]</span><span class="cmd">&gt; ${escapeHtml(text)}</span>`;
    } else {
      wrap.innerHTML = `<span class="timestamp">[${timestamp()}]</span><span class="result">${escapeHtml(text)}</span>`;
    }
    terminal.appendChild(wrap);
    // keep smooth scroll
    terminal.scrollTo({ top: terminal.scrollHeight, behavior: 'smooth' });
  }

  // Escape HTML to avoid injection when echoing
  function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"]+/g, (c)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

  // --- Command handling ---
  // History navigation
  const cmdHistory = [];
  let historyIndex = -1;

  function handleCommandLine(rawInput){
    if(!rawInput) return;
    const parts = parseInput(rawInput);
    if(parts.length===0) return;
    const command = parts[0];
    const args = parts.slice(1);

    // show command
    writeOutput(rawInput, {isCommand:true});

    // execute
    const fn = commands[command];
    let result;
    if(fn){
      try{
        if(typeof fn === 'function') result = fn(args);
        else result = fn;
      } catch(e){ result = 'Error running command: '+e.message; }
    } else {
      result = `Unknown command: ${command}`;
    }

    // if result is undefined or empty string and command itself handled output (like clear which already cleared), avoid double-print
    if(result !== '' && result !== undefined){ writeOutput(result); }

    // add to history (preserve original history call)
    commands.history(rawInput);
    cmdHistory.push(rawInput);
    historyIndex = cmdHistory.length;
  }

  // handle enter in input
  commandInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      const input = commandInput.value.trim();
      handleCommandLine(input);
      commandInput.value = '';
      e.preventDefault();
    }

    // Up / Down to navigate history
    if(e.key === 'ArrowUp'){
      if(cmdHistory.length===0) return;
      historyIndex = Math.max(0, historyIndex-1);
      commandInput.value = cmdHistory[historyIndex] || '';
      setTimeout(()=>commandInput.setSelectionRange(commandInput.value.length, commandInput.value.length),0);
      e.preventDefault();
    }
    if(e.key === 'ArrowDown'){
      if(cmdHistory.length===0) return;
      historyIndex = Math.min(cmdHistory.length, historyIndex+1);
      commandInput.value = cmdHistory[historyIndex] || '';
      e.preventDefault();
    }

    // Tab autocomplete
    if(e.key === 'Tab'){
      e.preventDefault();
      const cur = commandInput.value.trim();
      if(!cur) return;
      const keys = Object.keys(commands).filter(k => k.startsWith(cur));
      if(keys.length === 1){ commandInput.value = keys[0] + ' '; }
      else if(keys.length > 1){ writeOutput('Possible completions: ' + keys.join(', ')); }
    }

    // Ctrl+L to clear (like terminal)
    if(e.ctrlKey && e.key.toLowerCase() === 'l'){
      commands.clear();
      e.preventDefault();
    }

    // Ctrl+D to exit
    if(e.ctrlKey && e.key.toLowerCase() === 'd'){
      handleCommandLine('exit');
      e.preventDefault();
    }
  });

  // Accessibility: focus input when clicking terminal
  wrapper.addEventListener('click', (e)=>{ if(!wrapper.classList.contains('minimized')) commandInput.focus(); });

  // --- Draggable terminal (mouse + touch) ---
  const header = document.getElementById('terminalHeader');
  let offsetX = 0, offsetY = 0, isDragging = false;

  header.addEventListener('mousedown', (e)=>{
    if(!wrapper.classList.contains('minimized') && !isMaximized){ isDragging = true; offsetX = e.clientX - wrapper.offsetLeft; offsetY = e.clientY - wrapper.offsetTop; }
  });
  document.addEventListener('mouseup', ()=> isDragging = false);
  document.addEventListener('mousemove', (e)=>{ if(isDragging){ wrapper.style.left = (e.clientX - offsetX) + 'px'; wrapper.style.top = (e.clientY - offsetY) + 'px'; } });

  // touch support
  header.addEventListener('touchstart', (e)=>{
    const t = e.touches[0];
    if(!wrapper.classList.contains('minimized') && !isMaximized){ isDragging = true; offsetX = t.clientX - wrapper.offsetLeft; offsetY = t.clientY - wrapper.offsetTop; }
  }, {passive:true});
  document.addEventListener('touchend', ()=> isDragging = false);
  document.addEventListener('touchmove', (e)=>{ if(isDragging){ const t = e.touches[0]; wrapper.style.left = (t.clientX - offsetX) + 'px'; wrapper.style.top = (t.clientY - offsetY) + 'px'; } }, {passive:true});

  // --- Buttons (preserve original behavior but polished) ---
  document.getElementById('closeBtn').addEventListener('click', ()=>{
    // preserved original alert + reveal secret button
    alert('Terminal closed. Secret unlocked!');
    secretBtn.style.display = 'inline-block';
    // subtle flash effect
    secretBtn.animate([{ transform: 'scale(1)', opacity:1 }, { transform: 'scale(1.06)', opacity:1 }, { transform: 'scale(1)', opacity:1 }], { duration:420 });
  });

  document.getElementById('minimizeBtn').addEventListener('click', ()=>{
    wrapper.classList.add('minimized');
    // move to bottom-left quickly
    wrapper.style.transition = 'all 260ms cubic-bezier(.2,.9,.2,1)';
    wrapper.style.left = '10px'; wrapper.style.bottom = '10px'; wrapper.style.top = 'auto'; wrapper.style.width = '200px'; wrapper.style.height = '34px';
  });

  wrapper.addEventListener('click', ()=>{
    if(wrapper.classList.contains('minimized')){
      // restore
      wrapper.classList.remove('minimized');
      wrapper.style.width = normalState.width;
      wrapper.style.height = normalState.height;
      wrapper.style.top = normalState.top;
      wrapper.style.left = normalState.left;
    }
  });

  document.getElementById('maximizeBtn').addEventListener('click', ()=>{
    if(!isMaximized){
      normalState = { width: wrapper.style.width || '800px', height: wrapper.style.height || '500px', top: wrapper.style.top || '50px', left: wrapper.style.left || '50px' };
      wrapper.style.width = '100%'; wrapper.style.height = '100%'; wrapper.style.top = '0'; wrapper.style.left = '0'; isMaximized = true;
    } else {
      wrapper.style.width = normalState.width; wrapper.style.height = normalState.height; wrapper.style.top = normalState.top; wrapper.style.left = normalState.left; isMaximized = false;
    }
  });

  // --- Small utility features ---
  // Focus input on load
  window.addEventListener('load', ()=> commandInput.focus());

  // Keep focus after closing alert
  window.addEventListener('focus', ()=> commandInput.focus());

  // expose a helpful global for debugging (optional)
  window._jsTerminal = { commands, fileSystem, writeOutput };

  </script>
</body>
</html>
