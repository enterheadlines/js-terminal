<body>
  <div class="terminal-wrapper" id="terminalWrapper">
    <div class="terminal-header" id="terminalHeader">
      <span class="terminal-btn close" id="closeBtn"></span>
      <span class="terminal-btn minimize" id="minimizeBtn"></span>
      <span class="terminal-btn maximize" id="maximizeBtn"></span>
      <span style="margin-left:10px;color:#00ff00;">JS Terminal V2</span>
